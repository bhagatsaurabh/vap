name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  Build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Use Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: vap-dist
          path: dist

  Deploy-ghpages:
    needs: [Build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download dist artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: vap-dist
          path: dist

      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: gh-pages
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  Deploy-Firebase:
    needs: [Build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Download dist artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: vap-dist
          path: dist

      - uses: FirebaseExtended/action-hosting-deploy@v0.11.0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_VAP1_8D6C5 }}"
          channelId: live
          projectId: vap1-8d6c5

  Cleanup:
    needs: [Deploy-ghpages, Deploy-Firebase]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Delete dist artifacts
        uses: geekyeggo/delete-artifact@v6.0.0
        with:
          name: vap-dist
